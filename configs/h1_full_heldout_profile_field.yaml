experiment_name: h1-sft-full-heldout-profile-field

data:
  train_path: data/generated/h1/seed_30072026_heldout_profile_field/train.jsonl
  test_path: data/generated/h1/seed_30072026_heldout_profile_field/test.jsonl

model:
  name_or_path: .models/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  local_files_only: true

# Frozen copy of the nominal pilot protocol. Only the held-out family and its
# resulting template assignments differ from configs/h1_full.yaml.
training:
  # Effective batch = 16 micro-batch x 4 accumulation steps = 64 sequences.
  batch_size: 16
  gradient_accumulation_steps: 4
  learning_rate: 5.0e-5
  lr_scheduler: cosine
  final_learning_rate_ratio: 0.1
  warmup_ratio: 0.05
  warmup_min_steps: 20
  epochs: 3
  smoke_steps: null
  max_sequence_length: 1024
  seed: 42
  precision: bf16
  adam_beta1: 0.9
  adam_beta2: 0.95
  adam_epsilon: 1.0e-8
  weight_decay: 0.0
  max_grad_norm: 1.0

evaluation:
  # Runs at epoch 0 before the first optimizer step and after every epoch.
  batch_size: 64

runtime:
  device: auto
  debug: false
  prediction_log_limit: null
  output_dir: artifacts/h1_full_heldout_profile_field
  save_model: true

tracking:
  enabled: true
  project_name: do-models-only-memorize
  project_id: null
  task_name: null
  output_uri: false
  log_interval_steps: 1
  tags: [sft, h1, full, family-fold, heldout-profile-field, qwen3-0.6b]
