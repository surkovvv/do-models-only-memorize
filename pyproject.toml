[project]
name = "do-models-only-memorize"
version = "0.1.0"
description = "Controlled experiments on factual retrieval after supervised fine-tuning"
requires-python = ">=3.11,<3.14"
dependencies = [
    # Training and model tooling.
    "accelerate>=1.10",
    "datasets>=4.0,<5",
    "evaluate>=0.4",
    "huggingface-hub>=0.34,<1",
    "peft>=0.17",
    "safetensors>=0.6",
    "sentencepiece>=0.2",
    "tokenizers>=0.21",
    "torch>=2.7",
    "transformers>=4.55,<5",
    "trl>=0.21,<1",

    # Data, metrics, and analysis.
    "einops>=0.8",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "pandas>=2.3",
    "pyarrow>=20",
    "scikit-learn>=1.7",
    "scipy>=1.15",
    "seaborn>=0.13",

    # Experiment configuration, tracking, logs, and artifacts.
    "clearml>=2.0",
    "hydra-core>=1.3",
    "loguru>=0.7",
    "optuna>=4.4",
    "pydantic-settings>=2.10",
    "python-dotenv>=1.1",
    "pyyaml>=6.0",
    "rich>=14.0",
    "tensorboard>=2.20",
    "tqdm>=4.67",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30",
    "jupyterlab>=4.4",
    "mypy>=1.17",
    "pre-commit>=4.2",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "B"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
warn_unused_ignores = true
